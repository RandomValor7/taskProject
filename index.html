<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <!---barra de navegacion--->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a href="/" class="navbar-brand">
                App Productos
            </a>
        </div>
    </nav>

    <!---creamos el contenedor principal--->
    <div class="container">
        <div id="App" class="row pt-5">
            <!-- Contenedor del formulario -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h4>Add A Product</h4>
                    </div>
                    <!-- Formulario -->
                    <form id="product-form" class="card-body">
                        <!-- Nombre del producto -->
                        <div class="form-group mb-3">
                            <input class="form-control" type="text" id="name" placeholder="Product Name">
                        </div>
                        <!-- Precio del producto -->
                        <div class="form-group mb-3">
                            <input class="form-control" type="number" step="0.01" id="price" placeholder="Product Price">
                        </div>
                        <!-- Año del producto -->
                        <div class="form-group mb-3">
                            <input class="form-control" type="number" id="year" min="1900" value="2022" placeholder="Product Year">
                        </div>
                        <!-- Botón guardar -->
                        <div class="d-grid gap-2">
                            <input class="btn btn-primary" type="submit" value="Save">
                        </div>
                    </form>
                </div>
            </div>

            <!-- Contenedor de la lista de productos -->
            <div id="product-list" class="col-md-8">

            </div>
        </div>
    </div>

    <!---importamos el script de javascript--->
    <script src="app.js"></script>
</body>

</html>
